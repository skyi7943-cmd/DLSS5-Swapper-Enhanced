name: Community fork checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/release-guard.js
      - run: npm run build:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Do not publish or upload binaries before maintainer review.
